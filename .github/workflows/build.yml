name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y nasm gcc-multilib binutils grub-pc-bin grub-common xorriso mtools
      - name: Compile kernel
        run: |
          nasm -f elf32 boot.asm -o boot.o
          nasm -f elf32 isr.asm -o isr.o
          gcc -m32 -ffreestanding -fno-stack-protector -fno-pie -nostdlib -c kernel.c -o kernel.o
          ld -m elf_i386 -T linker.ld -o phoneos.bin boot.o isr.o kernel.o
      - name: Make bootable ISO
        run: |
          mkdir -p iso/boot/grub
          cp phoneos.bin iso/boot/
          printf 'set timeout=0\nset default=0\nmenuentry "PhoneOS" {\n  multiboot /boot/phoneos.bin\n  boot\n}\n' > iso/boot/grub/grub.cfg
          grub-mkrescue -o phoneos.iso iso
      - uses: actions/upload-artifact@v4
        with:
          name: phoneos-iso
          path: phoneos.iso
